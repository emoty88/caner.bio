<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume - {{ .Site.Title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.22;
      max-width: 860px;
      margin: 20px auto;
      padding: 0 18px;
      color: #111;
      font-size: 13px;
    }

    h1, h2, h3 {
      margin-bottom: 0.15em;
    }

    h1 {
      font-size: 1.7rem;
      border-bottom: 2px solid #ddd;
      padding-bottom: 0.12em;
      margin-top: 0;
    }

    h2 {
      font-size: 1rem;
      margin-top: 0.9em;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.12em;
    }

    h3 {
      font-size: 0.93rem;
      margin-top: 0.55em;
      margin-bottom: 0.1em;
    }

    p, li {
      font-size: 0.9rem;
    }

    p {
      margin-top: 0.15em;
      margin-bottom: 0.25em;
    }

    ul {
      padding-left: 1rem;
      margin-top: 0.15em;
      margin-bottom: 0.35em;
    }

    li {
      margin-bottom: 0.12em;
    }

    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 0.7em 0;
    }

    a {
      color: #0a66c2;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    strong {
      font-weight: 600;
    }

    .no-print {
      text-align: right;
      margin-bottom: 0.5em;
    }

    .print-btn {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ccc;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .print-btn:hover {
      background: #e8e8e8;
    }

    @page {
      size: Letter;
      margin: 0.55in 0.6in;
    }

    @media print {
      .no-print { display: none !important; }

      body {
        margin: 0;
        padding: 0;
        max-width: 100%;
        font-size: 12.5px;
        line-height: 1.16;
      }

      h1, h2, h3 {
        page-break-after: avoid;
        break-after: avoid;
      }

      ul, p {
        page-break-inside: auto;
        break-inside: auto;
      }

      a[href^="http"]:after {
        content: "";
      }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
  </div>
  {{- .Content }}
</body>
</html>
